<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Contently</title>
<style>
:root{--bg:#f7f5fa;--card:#fff;--ink:#1d1530;--mut:#6b6280;--pri:#5b2a86;--onp:#fff;--pri2:#eee6f6;--acc:#f2b134;--line:#e4ddee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f20;--card:#201832;--ink:#f1ecf8;--mut:#a79bbd;--pri:#b58aeb;--onp:#1a0f2b;--pri2:#2e2145;--line:#33284a}}
:root[data-theme="dark"]{--bg:#150f20;--card:#201832;--ink:#f1ecf8;--mut:#a79bbd;--pri:#b58aeb;--onp:#1a0f2b;--pri2:#2e2145;--line:#33284a}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
.w{max-width:560px;margin:auto;padding:16px}h1{font-size:24px;margin:0 0 4px;letter-spacing:-.4px}h2{font-size:17px;margin:20px 0 8px}h3{margin:0;font-size:15px}
.mut{color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:var(--pri);color:var(--onp);border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;width:100%;cursor:pointer;min-height:48px}.btn.s{background:var(--pri2);color:var(--pri)}.btn.sm{width:auto;padding:9px 13px;min-height:40px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 12px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}.chip.on{background:var(--pri);color:var(--onp);border-color:var(--pri)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 12px}label{font-size:13px;color:var(--mut);font-weight:600}
.fl{font-size:12px;color:var(--mut);font-weight:700;margin-top:10px}.tx{white-space:pre-wrap;margin:2px 0}.hk{font-size:18px;font-weight:700;line-height:1.3}
.hero{background:var(--pri);color:var(--onp);border-radius:18px;padding:16px;margin-bottom:12px}.hero .mut,.hero .fl{color:inherit;opacity:.8}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pri2);color:var(--pri);border:0;cursor:pointer}.pill.g{background:#fdeccb;color:#7a5200}.pill.p{background:#d8f0df;color:#1d5a30}
.demo{background:#fdeccb;color:#6a4700;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 8px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}nav button.on{color:var(--pri)}nav svg{display:block;margin:0 auto 2px;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#m.on{display:flex}.sh{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:10}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="m"></div><div id="t"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== Sample data (OGEYI is demonstration data) =====
const OG={name:'OGEYI',cat:'Fragrance',desc:'Elegant everyday perfumes for people who want to be remembered.',cust:'Young Nigerian women',voice:'Elegant, distinctive, modern, confident',plat:['Facebook','Instagram','WhatsApp'],prob:"I don't know what to post",demo:1,prods:[{n:'50ml perfume',p:'₦12,000',b:'Long-lasting, elegant, everyday fragrance'}]};
const SEED={goal:'Get more product inquiries',idea:'A product-focused lifestyle post',hook:"Your fragrance should be remembered even after you've left the room.",caption:"You know that moment when someone walks past you and asks, \"What are you wearing?\"\n\nThat's what the OGEYI 50ml perfume is for. Soft enough for work, memorable enough for the evening, and it stays with you long after you've left.\n\n₦12,000. Delivery available.",visual:"Film 10 seconds near a window in daylight. Spray the perfume on your wrist, then lift the bottle toward the camera. End on the bottle on a table beside a handbag and keys. No filters, hold the phone steady.",cta:"Send the word SCENT on WhatsApp and we'll tell you how to order."};
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const CATS=['Fashion','Beauty','Food','Fragrance','Skincare','Accessories','Services','Digital products','Other'],PLAT=['WhatsApp','Instagram','Facebook','TikTok','Website','Physical store'];
const PROBS=["I don't know what to post","I struggle with captions","I don't know how to promote my products","I don't have time to create content","My content doesn't get engagement","I struggle to turn views into sales"];
const TYPES=['Facebook post','Instagram caption','WhatsApp Status','Instagram Story','Reel/TikTok script','Product description','Promotional message','Educational post','Storytelling post','Customer testimonial post','Behind-the-scenes post'];
const GOALS=['Get sales','Get comments','Build trust','Introduce product','Educate customers','Increase awareness','Promote an offer'],TONES=['Premium','Friendly','Emotional','Bold','Playful','Professional','Simple','Conversational'];
const IDEAC=['Educational','Storytelling','Behind the scenes','Customer-focused','Product-focused','Engagement','Trending/seasonal','Promotional'];
const INTENT=['Product advertisement','Lifestyle post','Social media graphic concept','Reel idea','Product launch','Promotional campaign'];
const REGEN=['Generate another','Make it shorter','Make it more natural','Make it more persuasive','Make it more emotional','Make it more premium','Make it less salesy','Make it funnier','Make it more Nigerian','Make it simpler'];
const THEMES=['Brand awareness','Educational','Product spotlight','Engagement','Storytelling','Behind the scenes','Sales/conversion'];
// ===== Problem solvers: one tool per content problem =====
const prodDef=()=>{const x=(S.prof||OG).prods[0];return x?x.n+' '+x.p:''};
const TOOLS={
caption:{title:'Fix my caption',desc:'Paste a caption you wrote. Get three stronger versions.',btn:'Improve my caption',f:[{k:'cap',l:'Your caption',t:'ta',ph:'Paste it here'}],task:v=>`Task: improve this caption written by the business owner: "${v.cap}". In the note, say what is weak about it. Items: "Shorter version", "Warmer version", "Sales-focused version". Keep their product facts and do not invent prices.`},
promote:{title:'Promote my product',desc:'A 5-day promotion that fits your budget, even if it is zero.',btn:'Plan my promotion',f:[{k:'prod',l:'Product',t:'in',v:prodDef},{k:'bud',l:'Budget',t:'sel',o:['No budget','Under ₦5,000','₦5,000 to ₦20,000']}],task:v=>`Task: a 5-day promotion for "${v.prod}" with a budget of ${v.bud}. In the note, suggest one simple offer. Items in order: "WhatsApp broadcast message", "WhatsApp Status plan" (one line per day), "Facebook or Instagram promo post", "Day 4 reminder message", "Day 5 last-chance message". Use only realistic, low-cost tactics for a small seller.`},
week:{title:'Create my week',desc:'One tap: seven posts on your calendar and a single filming list.',btn:'Create my week',f:[]},
engage:{title:'Get more engagement',desc:'Find out why a post was ignored and get versions people reply to.',btn:'Boost my engagement',f:[{k:'post',l:'A post that got little attention (optional)',t:'ta',ph:'Paste it here'},{k:'plat',l:'Platform',t:'sel',o:['Instagram','Facebook','WhatsApp Status','TikTok']}],task:v=>`Task: help this business get more engagement. ${v.post.trim()?'Their post that was ignored: "'+v.post+'". ':''}Platform: ${v.plat}. In the note, give the most likely reasons people ignore posts like this. Items: "Rewrite 1", "Rewrite 2", "Rewrite 3" (each ends with a question or action that invites replies), "Comment starters" (5 questions to ask followers), "Replies to comments" (3 short templates).`},
sales:{title:'Close more sales',desc:'Ready-to-paste WhatsApp replies for the questions buyers ask.',btn:'Write my sales replies',f:[{k:'prod',l:'Product',t:'in',v:prodDef}],task:v=>`Task: WhatsApp sales replies for "${v.prod}". In the note, give one tip for turning viewers into buyers. Items: "When they ask how much", "When they ask if it is available", "When they say it is too expensive", "When they say they will think about it", "When they ask you to reduce the price", "Follow-up after 24 hours", "How to order and pay", "Asking for a testimonial after delivery". Keep each reply short, polite and ready to paste.`}};
const SOLVE=[{p:PROBS[0],t:'Open my plan',d:'A week of ready posts, one for each day.',go:()=>go('ideas',{it:'plan'})},{p:PROBS[1],t:'Fix my caption',d:'Paste yours. Get three better versions.',tool:'caption'},{p:PROBS[2],t:'Plan a promo',d:'A full promotion for one product, even with no budget.',tool:'promote'},{p:PROBS[3],t:'Create my week',d:'One tap: a week of posts on your calendar and one filming list.',tool:'week'},{p:PROBS[4],t:'Boost engagement',d:'See what is weak and get posts people reply to.',tool:'engage'},{p:PROBS[5],t:'Close more sales',d:'WhatsApp replies for price questions and follow-ups.',tool:'sales'}];
// ===== State =====
let S={prof:null,today:SEED,plan:null,cal:{}},sb=null,SESS=null,ACC={plan:'free',used:0,limit:20,expires:null},svt;
const save=()=>{clearTimeout(svt);svt=setTimeout(async()=>{if(!SESS)return;try{await sb.from('app_state').upsert({user_id:SESS.user.id,data:S,updated_at:new Date().toISOString()})}catch(e){}},600)};
const U={v:'home',ct:'post',it:'plan',cat:'',ideas:null,bundle:null,img:null,sel:0,f:{type:TYPES[0],goal:GOALS[0],tone:TONES[1],intent:INTENT[0],note:''}};
let D=null,SM=null,P={},pid=0;

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
// ===== AI layer (swap for your own backend later) =====
async function ai(task,img){
 if(!SESS)throw{code:'auth'};
 let image=null;
 if(img)image=await new Promise(r=>{const f=new FileReader();f.onload=()=>r({media_type:img.type||'image/jpeg',data:f.result.split(',')[1]});f.readAsDataURL(img)});
 const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+SESS.access_token},body:JSON.stringify({task,profile:S.prof||OG,image})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){if(j.code=='limit')ACC.used=ACC.limit;throw{code:j.code||'error'}}
 ACC.used=j.used;ACC.limit=j.limit;return j.data}
const errMsg=e=>e.code=='limit'?'You have used all your generations for this month. Go Pro to keep creating.':e.code=='auth'?'Please sign in again.':'Something went wrong. Try again.';
async function run(el,fn){el.innerHTML='<div class="card mut">Writing for you…</div>';try{await fn()}catch(e){el.innerHTML=`<div class="card">${esc(errMsg(e))}</div>${e.code=='limit'?'<button class="btn" onclick="upgrade()">Go Pro</button>':''}`}}
// ===== Pieces: every generated item can be copied, regenerated and added to the calendar =====
const mk=(title,d)=>{const id='p'+(++pid);P[id]={id,title,d};return P[id]};
const LB={idea:'Content idea',platform:'Post on',hook:'Hook',caption:'Caption',text:'Content',visual:'Visual direction',cta:'Call to action'};
const flat=d=>[d.hook,d.caption||d.text,d.cta].filter(Boolean).join('\n\n');
function inner(p,open){const d=p.d;return `<h3>${esc(p.title)}</h3>${['idea','platform','hook','caption','text','visual','cta'].filter(k=>d[k]).map(k=>`<div class="fl">${LB[k]}</div><div class="tx ${k=='hook'?'hk':''}">${esc(d[k])}</div>`).join('')}
<div class="row" style="margin-top:12px"><button class="btn sm" onclick="cp('${p.id}')">Copy</button><button class="btn sm s" onclick="ro('${p.id}')">Regenerate</button><button class="btn sm s" onclick="cal('${p.id}')">Add to calendar</button></div>
<div id="ro-${p.id}" style="display:${open?'block':'none'}"><div class="fl">What would you like changed?</div><div class="chips">${REGEN.map(r=>`<button class="chip" onclick="rg('${p.id}','${r}')">${r}</button>`).join('')}</div></div>`}
const card=(p,open)=>`<div class="card" id="pc-${p.id}">${inner(p,open)}</div>`;
const ro=id=>{const e=$('ro-'+id);e.style.display=e.style.display=='none'?'block':'none'};
async function cp(id){const t=flat(P[id].d);try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast('Copied. Paste it into WhatsApp or Instagram.')}
async function rg(id,ins){const p=P[id],el=$('pc-'+id);el.innerHTML='<div class="mut">Rewriting…</div>';const keys=Object.keys(p.d);try{const r=await ai(`Task: rewrite this content piece. Instruction: ${ins=='Generate another'?'write a completely different idea and wording for the same goal and product':ins}. Current piece: ${JSON.stringify(p.d)}. Return JSON with the same keys: ${keys.join(', ')}.`);Object.assign(p.d,r);save();el.innerHTML=inner(p)}catch(e){el.innerHTML=inner(p);toast(errMsg(e))}}
// ===== Sheets =====
const sheet=h=>{$('m').innerHTML=`<div class="sh">${h}<button class="btn s" style="margin-top:6px" onclick="closeM()">Close</button></div>`;$('m').className='on'};
const closeM=()=>$('m').className='';
function cal(id){const p=P[id];sheet(`<h2 style="margin-top:0">Which day?</h2><div class="chips">${DAYS.map(d=>`<button class="chip" onclick="addCal('${id}','${d}')">${d}</button>`).join('')}</div>`)}
function addCal(id,d){const p=P[id];(S.cal[d]=S.cal[d]||[]).push({id:Date.now(),title:p.title,text:flat(p.d),st:'Draft'});save();closeM();toast('Added to '+d)}
const ST=['Draft','Scheduled','Published'];
const cyc=(d,i)=>{const x=S.cal[d][i];x.st=ST[(ST.indexOf(x.st)+1)%3];save();R()},rmc=(d,i)=>{S.cal[d].splice(i,1);save();R()};
// ===== Form helpers =====
const chips=(list,cur,fn,multi)=>`<div class="chips">${list.map(x=>`<button class="chip ${(multi?cur.includes(x):cur==x)?'on':''}" onclick="${fn}('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')}</div>`;
const pk=(k,v)=>{D[k]=v;R()},pm=(k,v)=>{const a=D.plat;D.plat=a.includes(v)?a.filter(x=>x!=v):[...a,v];R()};
const sf=(k,v)=>{U.f[k]=v;R()};
function profForm(first){return `<label>Business name</label><input value="${esc(D.name)}" oninput="D.name=this.value" placeholder="e.g. Ada's Kitchen"><label>What do you sell?</label>${chips(CATS,D.cat,"pk.bind(null,'cat')")}
<label>Describe your business</label><textarea rows="3" oninput="D.desc=this.value" placeholder="In one or two sentences">${esc(D.desc)}</textarea><label>Who are your customers?</label><input value="${esc(D.cust)}" oninput="D.cust=this.value" placeholder="e.g. Young working women in Lagos">
<label>Where do you sell?</label>${chips(PLAT,D.plat,"pm.bind(null,'plat')",1)}<label>How should you sound?</label><input value="${esc(D.voice)}" oninput="D.voice=this.value" placeholder="e.g. Friendly, confident">
${first?`<label>Your biggest content problem</label>${chips(PROBS,D.prob,"pk.bind(null,'prob')")}`:''}`}
const blank=()=>({name:'',cat:'',desc:'',cust:'',voice:'',plat:['WhatsApp'],prob:'',prods:[]});
// ===== Views =====
const V={
onb(){D=D||blank();return `<h1>Contently</h1><p class="mut">Turn your products into content that gets attention, builds trust and drives sales.</p><button class="btn s" onclick="demo()">Try with OGEYI sample business</button><h2>Or set up your business</h2>${profForm(1)}<button class="btn" onclick="finish()">Start creating</button>`},
home(){const p=S.prof,t=mk("Today's post",S.today),all=Object.values(S.cal).flat(),pub=all.filter(x=>x.st=='Published').length,fi=SOLVE.findIndex(s=>s.p==p.prob);return `<h1>What should I post today?</h1><div class="mut">${esc(p.name)} · ${new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long'})}</div>${p.demo?'<div class="demo" style="margin-top:10px">OGEYI is sample demonstration data.</div>':''}
<div class="hero" style="margin-top:12px"><div class="fl" style="margin:0">Today's goal</div><div style="font-size:20px;font-weight:800">${esc(S.today.goal||'')}</div></div>${card(t,1)}
<div class="card"><h3>This week</h3><div class="mut">${pub} of ${all.length||7} planned posts published</div></div>${fi>=0?`<div class="hero"><div class="fl" style="margin:0">Your biggest problem</div><div style="font-size:18px;font-weight:800;margin:4px 0 10px">${esc(p.prob)}</div><button class="btn sm s" onclick="sol(${fi})">${SOLVE[fi].t}</button></div>`:''}<h2>Fix any content problem</h2>${SOLVE.map((s,i)=>`<div class="card row sp"><div style="flex:1"><h3>${esc(s.p)}</h3><div class="mut">${esc(s.d)}</div></div><button class="btn sm s" onclick="sol(${i})">${s.t}</button></div>`).join('')}<div class="card row sp"><div style="flex:1"><h3>Turn a product into content</h3><div class="mut">Facebook, Instagram, Status, Reel</div></div><button class="btn sm s" onclick="go('create',{ct:'bundle'})">Start</button></div>`},
create(){const p=S.prof,f=U.f;const tabs=`<div class="chips">${[['post','Single post'],['bundle','Product bundle']].map(x=>`<button class="chip ${U.ct==x[0]?'on':''}" onclick="U.ct='${x[0]}';R()">${x[1]}</button>`).join('')}</div>`;
const sel=(k,l)=>`<select onchange="U.f.${k}=this.value">${l.map(x=>`<option ${f[k]==x?'selected':''}>${x}</option>`).join('')}</select>`;
const prod=p.prods[U.sel]||{n:'',p:'',b:''};
if(U.ct=='post')return `<h1>Create</h1>${tabs}<label>Content type</label>${sel('type',TYPES)}<label>Goal</label>${sel('goal',GOALS)}<label>Tone</label>${sel('tone',TONES)}${p.prods.length?`<label>Product</label><select onchange="U.sel=this.value">${p.prods.map((x,i)=>`<option value="${i}" ${i==U.sel?'selected':''}>${esc(x.n)} ${esc(x.p)}</option>`).join('')}</select>`:''}<label>Anything specific? (optional)</label><input oninput="U.f.note=this.value" value="${esc(f.note)}" placeholder="e.g. Mother's Day offer, free delivery"><button class="btn" onclick="genPost()">Create content</button><div id="out" style="margin-top:14px"></div>`;
return `<h1>Create</h1>${tabs}<label>Product</label><input id="b1" value="${esc(prod.n)}"><label>Price</label><input id="b2" value="${esc(prod.p)}"><label>Target customer</label><input id="b3" value="${esc(p.cust)}"><label>Benefits</label><input id="b4" value="${esc(prod.b)}">
<label>Upload your product photo</label><input type="file" accept="image/*" onchange="pic(this)">${U.img?`<img class="thumb" src="${U.imgUrl}" alt="Your product photo">`:''}<label>What would you like to create?</label>${chips(INTENT,f.intent,"sf.bind(null,'intent')")}<button class="btn" onclick="genBundle()">Create all content</button><div id="out" style="margin-top:14px">${U.bundle||''}</div>`},
ideas(){const tabs=`<div class="chips">${[['plan','7-day plan'],['ideas','Never run out']].map(x=>`<button class="chip ${U.it==x[0]?'on':''}" onclick="U.it='${x[0]}';R()">${x[1]}</button>`).join('')}</div>`;
if(U.it=='plan')return `<h1>Your 7-day content plan</h1>${tabs}<button class="btn" onclick="genPlan()">${S.plan?'Create a new plan':'Create my 7-day plan'}</button><div id="out" style="margin-top:14px">${S.plan?S.plan.map((d,i)=>card(mk(`Day ${i+1} — ${THEMES[i]}`,d))).join(''):''}</div>`;
return `<h1>Never run out of content</h1>${tabs}${chips(IDEAC,U.cat,'idc')}<div id="out">${U.ideas?ideasH():''}</div>`},
tool(){const T=TOOLS[U.tool];return `<button class="chip" onclick="go('home')" style="margin-bottom:10px">‹ Home</button><h1>${T.title}</h1><div class="mut" style="margin-bottom:12px">${T.desc}</div>${T.f.map(f=>`<label>${f.l}</label>${f.t=='ta'?`<textarea id="tf-${f.k}" rows="4" placeholder="${esc(f.ph||'')}"></textarea>`:f.t=='sel'?`<select id="tf-${f.k}">${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="tf-${f.k}" value="${esc(f.v?f.v():'')}">`}`).join('')}<button class="btn" onclick="runTool()">${T.btn}</button><div id="out" style="margin-top:14px"></div>`},
calendar(){const n=Object.values(S.cal).flat().length;return `<h1>Content calendar</h1><div class="mut">Scheduling is simulated in this prototype.</div><div style="margin-top:12px">${DAYS.map(d=>`<div class="card"><h3>${d}</h3>${(S.cal[d]||[]).map((x,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row sp"><b style="font-size:14px">${esc(x.title)}</b><button class="pill ${x.st=='Scheduled'?'g':x.st=='Published'?'p':''}" onclick="cyc('${d}',${i})">${x.st}</button></div><div class="mut" style="white-space:pre-wrap">${esc(x.text.slice(0,120))}${x.text.length>120?'…':''}</div><button class="lk" style="background:none;border:0;color:var(--pri);font:inherit;font-size:13px;padding:6px 0" onclick="rmc('${d}',${i})">Remove</button></div>`).join('')||'<div class="mut">Nothing planned. Use "Add to calendar" on any content.</div>'}</div>`).join('')}</div>`},
business(){D=D||JSON.parse(JSON.stringify(S.prof));return `<h1>Your business</h1>${planH()}<div class="mut">Contently uses this every time it writes, so you never repeat yourself.</div>${S.prof.demo?'<div class="demo" style="margin-top:10px">OGEYI is sample demonstration data.</div>':''}<div style="margin-top:12px">${profForm(1)}</div><h2>Products and prices</h2>${D.prods.map((x,i)=>`<div class="card row sp"><div><h3>${esc(x.n)} · ${esc(x.p)}</h3><div class="mut">${esc(x.b)}</div></div><button class="btn sm s" onclick="D.prods.splice(${i},1);R()">Remove</button></div>`).join('')}
<div class="card"><label>Product</label><input id="n1"><label>Price</label><input id="n2" placeholder="₦"><label>Benefits</label><input id="n3"><button class="btn s" onclick="addProd()">Add product</button></div><button class="btn" onclick="saveP()">Save changes</button><div class="row" style="margin-top:10px"><button class="btn sm s" onclick="theme()">Dark mode</button><button class="btn sm s" onclick="sb.auth.signOut()">Sign out</button><button class="btn sm s" onclick="demo()">Reset to OGEYI sample</button></div>`}};
// ===== Actions =====
const ideasH=()=>U.ideas.map((x,i)=>`<div class="card"><h3>${esc(x.title)}</h3><div class="tx" style="margin:6px 0">${esc(x.hook)}</div><button class="btn sm" onclick="wi(${i})">Write this post</button></div>`).join('');
async function genPost(){const p=S.prof,f=U.f,pr=p.prods[U.sel];const el=$('out');await run(el,async()=>{const r=await ai(`Task: write one ${f.type} for the goal "${f.goal}" in a ${f.tone} tone${pr?` about ${pr.n} at ${pr.p}`:''}. ${f.note?'Extra detail: '+f.note+'. ':''}Return JSON {"text":"the ready-to-post content","visual":"what to film or photograph, if relevant"}.`);el.innerHTML=card(mk(f.type,r),1)})}
async function genBundle(){const el=$('out'),g=i=>$('b'+i).value;const pro=`${g(1)} at ${g(2)}, for ${g(3)}. Benefits: ${g(4)}`;await run(el,async()=>{const r=await ai(`Task: create a full content bundle for this product: ${pro}. Goal: ${U.f.intent}.${U.img?' A product photo is attached; use what you see in it.':' No photo was uploaded.'} Return JSON {"concept":"a short visual concept for the main ad image or graphic, describing what it would show","items":[exactly 9 objects {"title","text"} in this order: "Facebook post","Instagram caption","WhatsApp Status 1","WhatsApp Status 2","WhatsApp Status 3","15-second Reel script","Instagram Story","Product description","Call-to-action options" (3 options, one per line)]}.`,U.img);U.bundle=`<div class="card"><h3>Visual concept</h3>${U.img?`<img class="thumb" src="${U.imgUrl}" alt="Your product photo" style="margin-top:8px">`:''}<div class="tx">${esc(r.concept)}</div><div class="mut" style="margin-top:6px">Image generation is coming soon. For now, shoot this yourself with your phone.</div></div>`+r.items.map(x=>card(mk(x.title,{text:x.text}))).join('');el.innerHTML=U.bundle})}
function pic(i){const f=i.files[0];if(!f)return;if(f.size>3e6){toast('Choose a photo under 3 MB');return}U.img=f;U.imgUrl=URL.createObjectURL(f);U.bundle=null;const v=['b1','b2','b3','b4'].map(x=>$(x).value);R();['b1','b2','b3','b4'].forEach((x,k)=>$(x).value=v[k])}
async function genPlan(){const el=$('out');await run(el,async()=>{const r=await ai(`Task: a 7-day content plan starting today. Themes in order: ${THEMES.join(', ')}. Return a JSON array of exactly 7 objects {"idea","hook","caption","visual","cta","platform"}; platform must be one of the business's platforms.`);S.plan=r;save();el.innerHTML=r.map((d,i)=>card(mk(`Day ${i+1} — ${THEMES[i]}`,d))).join('')})}
async function idc(c){U.cat=c;U.ideas=null;R();const el=$('out');await run(el,async()=>{U.ideas=await ai(`Task: give 6 different content ideas in the category "${c}". Return a JSON array of {"title","hook"}.`);el.innerHTML=ideasH()})}
async function wi(i){const x=U.ideas[i];sheet('<div id="sx"></div>');await run($('sx'),async()=>{const r=await ai(`Task: write a ready-to-post piece for this idea: "${x.title}" with the hook "${x.hook}". Return JSON {"hook","caption","visual","cta","platform"}.`);$('sx').innerHTML=card(mk(x.title,r),0)})}
const addProd=()=>{if(!$('n1').value.trim()){toast('Enter a product name');return}D.prods.push({n:$('n1').value.trim(),p:$('n2').value,b:$('n3').value});R()};
const saveP=()=>{if(!D.name.trim()){toast('Add your business name');return}S.prof=D;save();toast('Saved');D=null;R()};
const sol=i=>{const s=SOLVE[i];s.go?s.go():go('tool',{tool:s.tool})};
async function runTool(){const k=U.tool,T=TOOLS[k],el=$('out');if(k=='week')return genWeek(el);const v={};T.f.forEach(f=>v[f.k]=$('tf-'+f.k).value);if(k=='caption'&&!v.cap.trim()){toast('Paste your caption first');return}
await run(el,async()=>{const r=await ai(T.task(v)+' Return JSON {"note":"one or two sentences of advice","items":[{"title","text"}]}.');el.innerHTML=`<div class="card"><h3>What to know</h3><div class="tx">${esc(r.note)}</div></div>`+r.items.map(x=>card(mk(x.title,{text:x.text}))).join('')})}
async function genWeek(el){await run(el,async()=>{const r=await ai(`Task: one week of posts starting today. Themes in order: ${THEMES.join(', ')}. Return JSON {"plan":[exactly 7 objects {"idea","hook","caption","visual","cta","platform"}],"shoot":"one filming list to shoot all 7 posts in a single 45-minute session, in the order to film them"}.`);S.plan=r.plan;S.cal={};const s=(new Date().getDay()+6)%7;r.plan.forEach((d,i)=>{const dy=DAYS[(s+i)%7];(S.cal[dy]=S.cal[dy]||[]).push({id:i,title:`Day ${i+1} — ${THEMES[i]}`,text:flat(d),st:'Draft'})});save();el.innerHTML=`<div class="card"><h3>Done. Your 7 posts are on the Calendar.</h3><div class="mut" style="margin:6px 0">Film everything in one session:</div><div class="tx">${esc(r.shoot)}</div></div>`+r.plan.map((d,i)=>card(mk(`Day ${i+1} — ${THEMES[i]}`,d))).join('')})}
const demo=()=>{S.prof=JSON.parse(JSON.stringify(OG));S.today=SEED;S.plan=null;S.cal={};save();D=null;U.sel=0;go('home')};
async function finish(){if(!D.name.trim()||!D.cat){toast('Add your business name and what you sell');return}D.prods=D.prods||[];S.prof=D;D=null;S.today=null;save();U.v='home';genToday()}
async function genToday(){const el=$('app');el.innerHTML='<div class="w"><div class="card mut">Writing your first post…</div></div>';try{S.today=await ai('Task: write today\'s post for this business. Choose one goal and one content idea. Return JSON {"goal","idea","hook","caption","visual","cta"}. visual = exact directions for what to film or photograph. cta = exactly what the customer should do next.');save()}catch(e){S.today={goal:'Get started',idea:'Your first post',caption:errMsg(e)}}R()}
const theme=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'};
const go=(v,x)=>{U.v=v;if(x)Object.assign(U,x);D=null;R();scrollTo(0,0)};
const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/>',create:'<path d="M12 20h9M16 4l4 4L8 20H4v-4z"/>',ideas:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 00-4-10z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>',business:'<path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16M10 20v-6h4v6"/>'};
function R(){P={};const v=S.prof?U.v:'onb';$('app').innerHTML='<div class="w">'+V[v]()+'</div>';$('nav').style.display=S.prof?'flex':'none';$('nav').innerHTML=[['home','Home'],['create','Create'],['ideas','Ideas'],['calendar','Calendar'],['business','Business']].map(x=>`<button class="${(U.v=='tool'?'create':U.v)==x[0]?'on':''}" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24">${IC[x[0]]}</svg>${x[1]}</button>`).join('')}
// ===== Plan, payments, login =====
const planH=()=>`<div class="card"><div class="row sp"><div><h3>${ACC.plan=='pro'?'Pro plan':'Free plan'}</h3><div class="mut">${ACC.used} of ${ACC.limit} generations used this month${ACC.expires?' · active until '+new Date(ACC.expires).toLocaleDateString('en-NG'):''}</div></div>${ACC.plan=='pro'?'':'<button class="btn sm" onclick="upgrade()">Go Pro</button>'}</div></div>`;
async function upgrade(){try{const r=await fetch('/api/checkout',{method:'POST',headers:{Authorization:'Bearer '+SESS.access_token}});const j=await r.json();if(j.url)location.href=j.url;else toast(j.error||'Could not start payment')}catch(e){toast('Could not start payment')}}
let AM='in';
function showAuth(){$('nav').style.display='none';$('app').innerHTML=`<div class="w"><h1>Contently</h1><p class="mut">Sign in to keep your business, plans and calendar on any phone.</p><label>Email</label><input id="ae" type="email" autocomplete="email"><label>Password</label><input id="ap" type="password" autocomplete="${AM=='in'?'current-password':'new-password'}" placeholder="At least 8 characters"><button class="btn" onclick="authGo()">${AM=='in'?'Sign in':'Create account'}</button><button class="btn s" style="margin-top:8px" onclick="AM=AM=='in'?'up':'in';showAuth()">${AM=='in'?'New here? Create an account':'Have an account? Sign in'}</button></div>`}
async function authGo(){const e=$('ae').value.trim(),p=$('ap').value;if(!e||p.length<8){toast('Enter your email and a password of 8+ characters');return}const r=AM=='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});if(r.error){toast(r.error.message);return}if(AM=='up'&&!r.data.session)toast('Check your email to confirm your account')}
async function onSess(x){SESS=x;if(!x){S={prof:null,today:SEED,plan:null,cal:{}};D=null;showAuth();return}
 const[a,st]=await Promise.all([fetch('/api/account',{headers:{Authorization:'Bearer '+x.access_token}}).then(r=>r.ok?r.json():null).catch(()=>null),sb.from('app_state').select('data').eq('user_id',x.user.id).maybeSingle()]);
 if(a)ACC=a;S=(st.data&&st.data.data&&st.data.data.prof!==undefined)?st.data.data:{prof:null,today:SEED,plan:null,cal:{}};
 R();if(location.search.includes('paid=1')){toast('Payment received. Pro activates in a moment.');history.replaceState(null,'','/');setTimeout(async()=>{const r=await fetch('/api/account',{headers:{Authorization:'Bearer '+SESS.access_token}});if(r.ok){ACC=await r.json();R()}},4000)}}
async function boot(){if(!window.CFG||CFG.SUPABASE_URL.includes('YOUR-')){$('app').innerHTML='<div class="w"><h1>Setup needed</h1><p class="mut">Add your Supabase URL and anon key to public/config.js. See README.md.</p></div>';return}
 sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
 const{data}=await sb.auth.getSession();await onSess(data.session);
 sb.auth.onAuthStateChange((ev,x)=>{if(x&&SESS)SESS=x;else if((x&&!SESS)||(!x&&SESS))onSess(x)})}
boot();
</script></body></html>
